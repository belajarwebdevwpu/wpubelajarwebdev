<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba Table Merging</title>
  </head>
  <body>
    <h1>
      <table border="1" cellspacing="0" cellpadding="10">
        <tr>
          <td rowspan="3">1,1</td>
          <td colspan="2">1,2</td>
        </tr>
        <tr>
          <td>2,2</td>
          <td>2,3</td>
        </tr>
        <tr>
          <td>3,2</td>
          <td>3,3</td>
        </tr>
      </table>
    </h1>
  </body>
</html>
